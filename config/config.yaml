# 个人大模型应用工程情报助手；密钥优先使用 Windows 用户环境变量。
app:
  timezone: Asia/Shanghai
rss:
  enabled: true
  freshness_filter:
    enabled: true
    max_age_days: 3
  feeds:
  - id: vllm-releases
    name: vLLM 推理部署 Releases
    url: https://github.com/vllm-project/vllm/releases.atom
    max_items: 10
  - id: sglang-releases
    name: SGLang 推理部署 Releases
    url: https://github.com/sgl-project/sglang/releases.atom
    max_items: 10
  - id: anthropic-engineering
    name: Anthropic Engineering 实践阅读
    url: https://www.anthropic.com/engineering
    max_items: 12
    max_age_days: 0
  - id: haystack-tutorials
    name: Haystack RAG 与 Agent 教程
    url: https://haystack.deepset.ai/tutorials
    max_items: 12
    max_age_days: 0
  - id: langfuse-cookbook
    name: Langfuse 评测与排障 Cookbook
    url: https://langfuse.com/guides/cookbook
    max_items: 12
    max_age_days: 0
  - id: langchain-practice
    name: LangChain 工程实践与评测
    url: https://www.langchain.com/blog/rss.xml
    max_items: 20
  - id: weaviate-practice
    name: Weaviate 检索与 RAG 实践
    url: https://weaviate.io/blog/rss.xml
    max_items: 20
  - id: qwen-blog
    name: Qwen 官方博客
    url: https://qwenlm.github.io/blog/index.xml
  - id: deepseek-updates
    name: DeepSeek V3 官方仓库提交
    url: https://github.com/deepseek-ai/DeepSeek-V3/commits/main.atom
  - id: glm-updates
    name: GLM 4.5 官方仓库提交
    url: https://github.com/zai-org/GLM-4.5/commits/main.atom
  - id: kimi-updates
    name: Kimi K2 官方仓库提交
    url: https://github.com/MoonshotAI/Kimi-K2/commits/main.atom
  - id: minimax-updates
    name: MiniMax M1 官方仓库提交
    url: https://github.com/MiniMax-AI/MiniMax-M1/commits/main.atom
  - id: ernie-releases
    name: ERNIE 官方 Releases
    url: https://github.com/PaddlePaddle/ERNIE/releases.atom
  - id: hunyuan-updates
    name: 混元 A13B 官方仓库提交
    url: https://github.com/Tencent-Hunyuan/Hunyuan-A13B/commits/main.atom
  - id: volcengine-sdk
    name: 豆包生态：火山引擎 SDK Releases
    url: https://github.com/volcengine/volcengine-python-sdk/releases.atom
  - id: openai-news
    name: OpenAI 官方公告（GPT 等）
    url: https://openai.com/news/rss.xml
  - id: claude-sdk
    name: Claude 官方 Python SDK Releases
    url: https://github.com/anthropics/anthropic-sdk-python/releases.atom
  - id: gemini-sdk
    name: Gemini 官方 Python SDK Releases
    url: https://github.com/googleapis/python-genai/releases.atom
  - id: grok-sdk
    name: Grok 官方 Python SDK Releases
    url: https://github.com/xai-org/xai-sdk-python/releases.atom
  - id: langchain-releases
    name: LangChain Releases
    url: https://github.com/langchain-ai/langchain/releases.atom
  - id: langgraph-releases
    name: LangGraph Releases
    url: https://github.com/langchain-ai/langgraph/releases.atom
  - id: deepagents-releases
    name: Deep Agents Releases
    url: https://github.com/langchain-ai/deepagents/releases.atom
  - id: llamaindex-releases
    name: RAG：LlamaIndex Releases
    url: https://github.com/run-llama/llama_index/releases.atom
  - id: huggingface-blog
    name: Hugging Face 技术实践
    url: https://huggingface.co/blog/feed.xml
ai:
  model: deepseek/deepseek-v4-flash
  api_key: ''
  api_base: ''
  timeout: 120
  temperature: 1.0
  max_tokens: 5000
  num_retries: 1
  fallback_models: []
ai_filter:
  batch_size: 200
  min_score: 0.7
ai_analysis:
  language: Chinese
  prompt_file: ai_engineering_prompt.txt
  max_news_for_analysis: 80
